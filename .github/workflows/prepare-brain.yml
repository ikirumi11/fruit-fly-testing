name: Prepare fruit fly connectome

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy
      - name: Convert supplied brain data
        run: python prepare_brain.py
      - name: Commit generated browser dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brain.json
          if git diff --cached --quiet; then
            echo 'brain.json is already current'
          else
            git commit -m 'Generate browser-ready fruit fly connectome dataset'
            git push
          fi
