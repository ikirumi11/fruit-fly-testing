<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Site Builder</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#edf2f7;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}#loader{position:fixed;inset:0;display:flex;flex-direction:column;background:#07090d;z-index:5}.top{padding:18px 20px 14px;border-bottom:1px solid #202733;background:#0c1016}.title{font-size:20px;font-weight:750}.sub{margin-top:4px;color:#8d99a8;font-size:13px}.overall{height:7px;background:#1a2029;border-radius:99px;overflow:hidden;margin-top:14px}.overall i{display:block;height:100%;width:0;background:#72b7ff;transition:width .12s}.summary{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:#9da8b5;font-size:12px}.summary b{color:#edf2f7}.files{flex:1;overflow:auto;padding:12px 14px 30px}.file{border:1px solid #1f2731;background:#0c1117;border-radius:10px;padding:11px 12px;margin-bottom:8px}.line{display:flex;gap:10px;align-items:center}.name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.state{font-size:11px;color:#82909e;white-space:nowrap}.bar{height:4px;background:#18202a;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#65aef5}.meta{display:flex;justify-content:space-between;margin-top:6px;color:#71808f;font-size:11px}.done .state{color:#82d6a4}.error .state{color:#ff9292}.error .bar i{background:#ff7373}.active{border-color:#31506d}.active .state{color:#8bc7ff}#site{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff;z-index:2}.showSite #loader{display:none}.showSite #site{display:block}.siteTop{position:fixed;z-index:3;top:10px;right:10px;display:none}.showSite .siteTop{display:block}.siteTop button{border:1px solid #34414e;background:#10161d;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;opacity:.88}.siteTop button:hover{opacity:1}.foot{padding:10px 14px;border-top:1px solid #202733;color:#6f7d8b;font-size:11px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="loader">
<div class="top">
<div class="title">Building GitHub site</div>
<div class="sub" id="status">Connecting to GitHub…</div>
<div class="overall"><i id="overallBar"></i></div>
<div class="summary"><span>Files: <b id="fileCount">0</b></span><span>Done: <b id="doneCount">0</b></span><span>Total: <b id="totalSize">—</b></span><span>Downloaded: <b id="downloaded">0 B</b></span><span>ETA: <b id="eta">—</b></span></div>
</div>
<div class="files" id="files"></div>
<div class="foot" id="foot">Every repository file is downloaded before the site is shown.</div>
</div>
<iframe id="site" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
<div class="siteTop"><button onclick="location.reload()">Reload loader</button></div>
<script>
const OWNER="ikirumi11";
const REPO="fruit-fly-testing";
const BRANCH="main";
const ROOT="";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${encodeURIComponent(BRANCH)}/`;
const $=id=>document.getElementById(id);
const filesBox=$("files");
const fileRows=new Map();
const fileData=new Map();
const blobUrls=new Map();
let totalBytes=0,downloadedBytes=0,done=0,startTime=0;
function fmtBytes(n){if(!Number.isFinite(n)||n<0)return "—";const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (n<10&&i? n.toFixed(1):Math.round(n))+" "+u[i]}
function fmtTime(sec){if(!Number.isFinite(sec)||sec<0)return "—";sec=Math.ceil(sec);if(sec<60)return sec+"s";const m=Math.floor(sec/60),s=sec%60;if(m<60)return m+"m "+s+"s";return Math.floor(m/60)+"h "+(m%60)+"m"}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function addRow(path,size){const el=document.createElement("div");el.className="file";el.innerHTML=`<div class="line"><div class="name" title="${esc(path)}">${esc(path)}</div><div class="state">Waiting</div></div><div class="bar"><i></i></div><div class="meta"><span>0%</span><span>${fmtBytes(size)}</span><span>ETA —</span></div>`;filesBox.appendChild(el);fileRows.set(path,{el,state:el.querySelector(".state"),bar:el.querySelector("i"),pct:el.querySelector(".meta span:nth-child(1)"),size:el.querySelector(".meta span:nth-child(2)"),eta:el.querySelector(".meta span:nth-child(3)")})}
function setRow(path,pct,state,eta){const r=fileRows.get(path);if(!r)return;r.el.classList.toggle("active",state==="Downloading");r.el.classList.toggle("done",state==="Done");r.el.classList.toggle("error",state==="Error");r.state.textContent=state;r.bar.style.width=Math.max(0,Math.min(100,pct))+"%";r.pct.textContent=Math.round(pct)+"%";r.eta.textContent="ETA "+(eta||"—")}
function setOverall(){const elapsed=(performance.now()-startTime)/1000;const speed=elapsed>0?downloadedBytes/elapsed:0;const remaining=Math.max(0,totalBytes-downloadedBytes);$("downloaded").textContent=fmtBytes(downloadedBytes);$("overallBar").style.width=(totalBytes?Math.min(100,downloadedBytes/totalBytes*100):done/(Math.max(1,fileRows.size))*100)+"%";$("doneCount").textContent=done;$("eta").textContent=speed>0?fmtTime(remaining/speed):"—"}
async function getTree(){const r=await fetch(API,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});if(!r.ok)throw Error("GitHub API error: "+r.status+" "+r.statusText);const j=await r.json();if(j.truncated)throw Error("GitHub returned a truncated file list. This repository is too large for one recursive tree request.");return (j.tree||[]).filter(x=>x.type==="blob")}
function findIndex(paths){const clean=x=>x.replace(/^\.\//,"").replace(/^\//,"").toLowerCase();const list=paths.map(x=>x.path);if(ROOT){const exact=clean(ROOT+"/index.html");const hit=list.find(x=>clean(x)===exact);if(hit)return hit}return list.find(x=>clean(x)==="index.html")||list.find(x=>clean(x).endsWith("/index.html"))||null}
function relative(base,value){const b=base.split("/");b.pop();const v=value.split("/");for(const p of v){if(!p||p===".")continue;if(p==="..")b.pop();else b.push(p)}return b.join("/")}
function localPath(value,current){if(!value)return null;value=value.trim();if(/^(https?:|data:|blob:|javascript:|mailto:|tel:|#|\/\/)/i.test(value))return null;if(value.startsWith("/"))return value.slice(1);return relative(current,value)}
function makeObjectUrl(path,bytes,mime){const old=blobUrls.get(path);if(old)URL.revokeObjectURL(old);const u=URL.createObjectURL(new Blob([bytes],{type:mime||"application/octet-stream"}));blobUrls.set(path,u);return u}
function mime(path){const e=path.split(".").pop().toLowerCase();return ({html:"text/html",htm:"text/html",css:"text/css",js:"text/javascript",mjs:"text/javascript",json:"application/json",svg:"image/svg+xml",txt:"text/plain",xml:"application/xml",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",avif:"image/avif",ico:"image/x-icon",mp3:"audio/mpeg",wav:"audio/wav",ogg:"audio/ogg",mp4:"video/mp4",webm:"video/webm",wasm:"application/wasm",glb:"model/gltf-binary",gltf:"model/gltf+json"})[e]||"application/octet-stream"}
async function downloadFile(item,index,total){const path=item.path;setRow(path,0,"Downloading",null);const t0=performance.now();try{const r=await fetch(RAW+path.split("/").map(encodeURIComponent).join("/"),{cache:"no-store"});if(!r.ok)throw Error(r.status+" "+r.statusText);const expected=Number(r.headers.get("content-length"))||item.size||0;const reader=r.body?r.body.getReader():null;let chunks=[],got=0;if(reader){while(true){const x=await reader.read();if(x.done)break;chunks.push(x.value);got+=x.value.byteLength;downloadedBytes+=x.value.byteLength;const pct=expected?got/expected*100:0;const elapsed=(performance.now()-t0)/1000;const speed=elapsed>0?got/elapsed:0;setRow(path,pct,"Downloading",speed&&expected?fmtTime(Math.max(0,expected-got)/speed):null);setOverall()}}else{const b=new Uint8Array(await r.arrayBuffer());chunks=[b];got=b.byteLength;downloadedBytes+=got;setOverall()}let bytes=new Uint8Array(got),at=0;for(const c of chunks){bytes.set(c,at);at+=c.byteLength}const type=mime(path);fileData.set(path,{bytes,type,text:(type.startsWith("text/")||type.includes("javascript")||type.includes("json")||type.includes("xml")||type.includes("svg"))?new TextDecoder().decode(bytes):null});makeObjectUrl(path,bytes,type);done++;setRow(path,100,"Done",null);setOverall()}catch(e){setRow(path,0,"Error",null);throw Error(path+": "+e.message)}}
function rewriteCss(css,current){return css.replace(/url\(\s*(["']?)([^"')]+)\1\s*\)/gi,(m,q,u)=>{const p=localPath(u,current);return p&&blobUrls.has(p)?`url("${blobUrls.get(p)}")`:m})}
function rewriteHtml(html,current){const parser=new DOMParser();const doc=parser.parseFromString(html,"text/html");doc.querySelectorAll("base").forEach(x=>x.remove());for(const el of doc.querySelectorAll("script[src],link[href],img[src],source[src],video[src],audio[src],iframe[src],object[data],input[src],image[href]")){for(const attr of ["src","href","data"]){if(!el.hasAttribute(attr))continue;const v=el.getAttribute(attr),p=localPath(v,current);if(p&&blobUrls.has(p))el.setAttribute(attr,blobUrls.get(p));}}
for(const el of doc.querySelectorAll("style"))el.textContent=rewriteCss(el.textContent,current);for(const el of doc.querySelectorAll("[style]"))el.setAttribute("style",rewriteCss(el.getAttribute("style"),current));
for(const el of doc.querySelectorAll("link[rel~='stylesheet']")){const v=el.getAttribute("href"),p=localPath(v,current);if(p&&fileData.get(p)?.text){const style=doc.createElement("style");style.textContent=rewriteCss(fileData.get(p).text,p);el.replaceWith(style)}}
for(const el of doc.querySelectorAll("script[src]")){const v=el.getAttribute("src");const p=[...blobUrls].find(([k,u])=>u===v)?.[0];if(p&&fileData.get(p)?.text){el.removeAttribute("src");el.textContent=fileData.get(p).text}}
const marker=doc.createElement("script");marker.textContent=`window.GITHUB_SITE_LOADER=true;window.GITHUB_REPOSITORY=${JSON.stringify(OWNER+"/"+REPO)};window.GITHUB_FILE_COUNT=${fileData.size};`;doc.body?doc.body.appendChild(marker):doc.documentElement.appendChild(marker);return "<!doctype html>"+doc.documentElement.outerHTML}
async function build(){try{startTime=performance.now();$("status").textContent="Reading repository file list…";const tree=await getTree();$("fileCount").textContent=tree.length;tree.forEach(x=>{totalBytes+=x.size||0;addRow(x.path,x.size||0)});$("totalSize").textContent=fmtBytes(totalBytes);setOverall();$("status").textContent=`Downloading ${tree.length} files…`;
for(let i=0;i<tree.length;i++){await downloadFile(tree[i],i,tree.length);$("status").textContent=`Downloaded ${done}/${tree.length} files…`}
const index=findIndex(tree);if(!index)throw Error("No index.html was found in the repository.");$("status").textContent="All files downloaded. Building site…";const source=fileData.get(index)?.text;if(source==null)throw Error("index.html could not be decoded as text.");const output=rewriteHtml(source,index);$("status").textContent="Site ready.";$("foot").textContent=`Built from ${fileData.size} GitHub files. Showing ${index}.`;setTimeout(()=>{$("site").srcdoc=output;document.body.classList.add("showSite")},150)}catch(e){$("status").textContent="Build failed";$("foot").textContent=e.message;console.error(e)}}
build();
</script>
</body>
</html>
