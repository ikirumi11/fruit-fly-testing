<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fruit Fly Brain — Loader</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080c;color:#edf3fa;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{display:flex;flex-direction:column}.header{padding:18px 20px 15px;background:#0b0f15;border-bottom:1px solid #202936}.title{font-size:21px;font-weight:800}.subtitle{margin-top:4px;color:#8996a5;font-size:13px}.overall{height:8px;margin-top:15px;background:#171e27;border-radius:99px;overflow:hidden}.overall i{display:block;height:100%;width:0;background:#72b8ff;transition:width .1s}.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:#788696;font-size:12px}.stats b{color:#edf3fa}.files{flex:1;overflow:auto;padding:12px 14px 30px}.file{background:#0b1016;border:1px solid #202936;border-radius:10px;padding:10px 12px;margin-bottom:8px}.file.active{border-color:#355473}.file.done{border-color:#284936}.file.error{border-color:#633b3b}.line{display:flex;align-items:center;gap:10px}.name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.state{font-size:11px;color:#778696;white-space:nowrap}.done .state{color:#83d9a5}.active .state{color:#8fcaff}.error .state{color:#ff9a9a}.bar{height:4px;background:#171f29;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#64aef3}.done .bar i{background:#70c98f}.error .bar i{background:#ed6e6e}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:#667585;font-size:10px}.footer{padding:10px 14px;border-top:1px solid #202936;color:#687686;font-size:11px;background:#090d12}#site{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}.ready #loader{display:none}.ready #site{display:block}#error{display:none;position:fixed;inset:0;padding:28px;background:#080b10;color:#fff;overflow:auto}#error h2{margin:0 0 8px}.errorText{color:#ff9b9b;white-space:pre-wrap;font:13px/1.5 monospace}
</style>
</head>
<body>
<div id="loader">
<header class="header"><div class="title">Preparing Fruit Fly Brain</div><div class="subtitle" id="status">Connecting to download server…</div><div class="overall"><i id="overallBar"></i></div><div class="stats"><span>Files <b id="count">0</b></span><span>Done <b id="done">0</b></span><span>Downloaded <b id="downloaded">0 B</b></span><span>Total <b id="total">—</b></span><span>Speed <b id="speed">—</b></span><span>ETA <b id="eta">—</b></span></div></header>
<main class="files" id="files"></main><footer class="footer">Downloading the repository locally first. The viewer will start only after the files finish.</footer></div>
<div id="error"><h2>Loader error</h2><div class="errorText" id="errorText"></div></div><iframe id="site" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads allow-same-origin"></iframe>
<script>
(()=>{
'use strict';
const VERSION='567da8c4a2a3a2be03d234a9642d7e7f4e4cb2db';
const CDN='https://cdn.jsdelivr.net/gh/ikirumi11/fruit-fly-testing@main/';
const FILES=[
 ['brain.html',19000],
 ['brain_raw.txt',23450165],
 ['prepare_brain.py',3695],
 ['README.md',996],
 ['index.html',14000]
];
const $=id=>document.getElementById(id),rows=new Map(),files=new Map(),urls=new Map();
let total=FILES.reduce((a,x)=>a+x[1],0),done=0,got=0,start=performance.now();
$('count').textContent=FILES.length;$('total').textContent=fmt(total);
function fmt(n){if(!isFinite(n))return '—';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return (i&&n<10?n.toFixed(1):Math.round(n))+' '+u[i]}
function eta(s){if(!isFinite(s)||s<0)return '—';s=Math.ceil(s);if(s<60)return s+'s';return Math.floor(s/60)+'m '+s%60+'s'}
function row(path,size){const e=document.createElement('div');e.className='file';e.innerHTML='<div class="line"><div class="name">'+path+'</div><div class="state">Waiting</div></div><div class="bar"><i></i></div><div class="meta"><span class="pct">0%</span><span class="size">'+fmt(size)+'</span><span class="eta">ETA —</span></div>';$('files').appendChild(e);rows.set(path,{e,state:e.querySelector('.state'),bar:e.querySelector('.bar i'),pct:e.querySelector('.pct'),eta:e.querySelector('.eta')})}
function setrow(path,p,state,et){const r=rows.get(path);r.e.className='file '+(state==='Downloading'?'active ':state==='Done'?'done ':state==='Error'?'error ':'');r.state.textContent=state;r.bar.style.width=Math.min(100,p)+'%';r.pct.textContent=Math.round(p)+'%';r.eta.textContent='ETA '+(et||'—')}
FILES.forEach(x=>row(x[0],x[1]));
function progress(){const sec=(performance.now()-start)/1000,rate=sec?got/sec:0;$('overallBar').style.width=Math.min(100,got/total*100)+'%';$('downloaded').textContent=fmt(got);$('done').textContent=done;$('speed').textContent=rate?fmt(rate)+'/s':'—';$('eta').textContent=rate?eta((total-got)/rate):'—'}
async function download(path,size){setrow(path,0,'Downloading');const url=CDN+path.split('/').map(encodeURIComponent).join('/')+'?v='+VERSION;try{const r=await fetch(url,{cache:'no-store',mode:'cors'});if(!r.ok)throw Error('HTTP '+r.status+' '+r.statusText);if(!r.body)throw Error('Browser did not provide a readable download stream.');const reader=r.body.getReader(),parts=[];let n=0;while(true){const x=await reader.read();if(x.done)break;parts.push(x.value);n+=x.value.byteLength;got+=x.value.byteLength;setrow(path,size?Math.min(100,n/size*100):0,'Downloading',null);progress()}const data=new Uint8Array(n);let o=0;for(const p of parts){data.set(p,o);o+=p.byteLength}files.set(path,{data,type:mime(path)});done++;setrow(path,100,'Done');progress()}catch(e){setrow(path,0,'Error');throw new Error(path+': '+e.message)}}
function mime(p){const e=p.split('.').pop().toLowerCase();return ({html:'text/html',css:'text/css',js:'text/javascript',json:'application/json',txt:'text/plain',py:'text/plain',md:'text/markdown'})[e]||'application/octet-stream'}
function blob(path){if(urls.has(path))return urls.get(path);const f=files.get(path);if(!f)return null;const u=URL.createObjectURL(new Blob([f.data],{type:f.type}));urls.set(path,u);return u}
function rel(base,v){if(!v||/^(https?:|data:|blob:|javascript:|mailto:|tel:|#|\/\/)/i.test(v))return null;const a=(base.split('/').slice(0,-1).concat(v.split('/'))).join('/').split('/'),o=[];for(const p of a){if(!p||p==='.'){continue}else if(p==='..')o.pop();else o.push(p)}return o.join('/')}
function build(source,path){const d=new DOMParser().parseFromString(source,'text/html');d.querySelectorAll('base').forEach(x=>x.remove());d.querySelectorAll('link[href],img[src],source[src],video[src],audio[src],script[src],iframe[src],object[data]').forEach(el=>{for(const a of ['href','src','data']){if(!el.hasAttribute(a))continue;const p=rel(path,el.getAttribute(a));if(p&&files.has(p))el.setAttribute(a,blob(p))}});for(const s of [...d.querySelectorAll('script[src]')]){const p=rel(path,s.getAttribute('src'));if(p&&files.has(p)){const f=files.get(p);if(f.type.startsWith('text/')){s.removeAttribute('src');s.textContent=new TextDecoder().decode(f.data)}}}const bridge=d.createElement('script');bridge.textContent='window.__FRUIT_FLY_LOCAL_LOADED=true;';d.body.appendChild(bridge);return '<!doctype html>'+d.documentElement.outerHTML}
function error(e){$('errorText').textContent=e.stack||e;$('error').style.display='block';$('loader').style.display='none'}
async function start(){try{$('status').textContent='Downloading files from CDN…';for(const [p,s] of FILES)await download(p,s);$('status').textContent='Starting local viewer…';const source=new TextDecoder().decode(files.get('brain.html').data);$('site').srcdoc=build(source,'brain.html');document.body.classList.add('ready')}catch(e){error(e)}}
start();
})();
</script></body></html>
